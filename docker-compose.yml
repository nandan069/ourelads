version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ourelads:latest
    container_name: ourelads-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/server/database/ourelads.db
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SESSION_EXPIRY=${SESSION_EXPIRY:-24h}
      - UPLOAD_DIR=/app/public/uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL}
      - GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - ourelads-db:/app/server/database
      - ourelads-uploads:/app/public/uploads
      - ourelads-backups:/app/server/database/backups
      - ourelads-logs:/var/log/pm2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ourelads-network

  # Optional: Nginx reverse proxy with SSL termination
  # nginx:
  #   image: nginx:alpine
  #   container_name: ourelads-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - ourelads-network

volumes:
  ourelads-db:
    driver: local
  ourelads-uploads:
    driver: local
  ourelads-backups:
    driver: local
  ourelads-logs:
    driver: local

networks:
  ourelads-network:
    driver: bridge